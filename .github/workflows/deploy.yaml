name: Deploy react
on:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}
      - run: docker build -t judyassem0/react-test -f Dockerfile.dev .
      - run: docker run -e CI=true judyassem0/react-test npm run test
 
      - run: docker build -t judyassem0/multi-client ./client
      - run: docker build -t judyassem0/multi-nginx ./nginx
      - run: docker build -t judyassem0/multi-server ./server
      - run: docker build -t judyassem0/multi-worker ./worker
 
      - run: docker push judyassem0/multi-client 
      - run: docker push judyassem0/multi-nginx 
      - run: docker push judyassem0/multi-server 
      - run: docker push judyassem0/multi-worker 